name: Deploy to Portainer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: portainer-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      URL: ${{ secrets.PORTAINER_URL }}
      KEY: ${{ secrets.PORTAINER_TOKEN }}
      WEBHOOK: ${{ secrets.APPOINTMENT_WEBHOOK }}
      ENDPOINT: ${{ vars.PORTAINER_ENDPOINT_ID }}
      STACK: chivacare-com
    steps:
      - name: Create or redeploy stack
        run: |
          set -euo pipefail
          api() {
            local code
            code=$(curl -sS -o res.json -w '%{http_code}' -H "X-API-Key: $KEY" -H "Content-Type: application/json" "$@")
            # Print only Portainer's error message, not the full response (logs are public).
            if [ "$code" -ge 400 ]; then echo "HTTP $code: $(jq -r '[.message, .details] | map(select(.)) | join(": ")' res.json 2>/dev/null || cat res.json)" >&2; return 1; fi
            cat res.json
          }
          # Accept the secret with or without a trailing "/" or "/api".
          URL="${URL%/}"; URL="${URL%/api}"
          if [ -z "$ENDPOINT" ]; then
            ENDPOINT=$(api "$URL/api/endpoints" | jq -r '.[0].Id')
            echo "Using Portainer environment $ENDPOINT"
          fi
          STACKS=$(api "$URL/api/stacks")
          ID=$(echo "$STACKS" | jq -r --arg n "$STACK" '.[] | select(.Name == $n) | .Id' | head -1)
          # Keep env vars set in Portainer (redeploy replaces the list). A new SITE_VERSION per commit
          # makes compose rebuild instead of reusing the old image; the webhook secret wins when set.
          ENV=$(echo "$STACKS" | jq -c --arg n "$STACK" --arg v "${{ github.sha }}" --arg w "$WEBHOOK" '
            ([.[] | select(.Name == $n) | .Env // []] | first // [])
            | map(select(.name != "SITE_VERSION" and ($w == "" or .name != "APPOINTMENT_WEBHOOK")))
            + [{name: "SITE_VERSION", value: $v}]
            + (if $w == "" then [] else [{name: "APPOINTMENT_WEBHOOK", value: $w}] end)')
          if [ -z "$ID" ]; then
            api -X POST "$URL/api/stacks/create/standalone/repository?endpointId=$ENDPOINT" -d "$(jq -n \
              --arg n "$STACK" --arg repo "${{ github.server_url }}/${{ github.repository }}" --argjson env "$ENV" \
              '{name: $n, repositoryURL: $repo, repositoryReferenceName: "refs/heads/main", composeFile: "docker-compose.yml", env: $env}')" > /dev/null
            echo "Created stack $STACK"
          else
            api -X PUT "$URL/api/stacks/$ID/git/redeploy?endpointId=$ENDPOINT" -d "$(jq -n --argjson env "$ENV" \
              '{repositoryReferenceName: "refs/heads/main", pullImage: false, prune: true, env: $env}')" > /dev/null
            echo "Redeployed stack $STACK ($ID)"
          fi
